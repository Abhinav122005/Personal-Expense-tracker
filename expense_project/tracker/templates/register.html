<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Expense Tracker</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'styles.css' %}?v=2">
</head>
<body class="auth-body">
    {% if messages %}
    <div class="toast-container">
        {% for message in messages %}
            <div class="toast {% if message.tags %}{{ message.tags }}{% endif %} show static-toast">
                <span>{% if message.tags == 'success' %}✅{% elif message.tags == 'error' %}❌{% else %}ℹ️{% endif %}</span> 
                <span>{{ message }}</span>
            </div>
        {% endfor %}
    </div>
    {% endif %}

    <div class="auth-container">
        <h1>Register</h1>
        <style>
            .errorlist { display: none !important; }
        </style>
        <form method="post" class="auth-form">
            {% csrf_token %}
            <p>
                <label for="id_email">Email Address:</label>
                <input type="email" name="email" maxlength="320" required id="id_email">
            </p>
            <p>
                <label for="id_display_name">Username:</label>
                <input type="text" name="display_name" maxlength="150" required id="id_display_name">
            </p>
            <p>
                <label for="id_gender">Gender:</label>
                <select name="gender" required id="id_gender">
                    <option value="" disabled selected>Select Gender</option>
                    <option value="M">Male</option>
                    <option value="F">Female</option>
                    <option value="O">Other</option>
                </select>
            </p>
            <p>
                <label for="id_security_question">Security Question (Used to reset password):</label>
                <select name="security_question" required id="id_security_question">
                    <option value="" disabled selected>Select a question...</option>
                    <option value="pet">What was the name of your first pet?</option>
                    <option value="city">In what city were you born?</option>
                    <option value="mother">What is your mother's maiden name?</option>
                    <option value="school">What was the name of your first school?</option>
                    <option value="car">What was the make of your first car?</option>
                </select>
            </p>
            <p>
                <label for="id_security_answer">Security Answer:</label>
                <input type="text" name="security_answer" required id="id_security_answer" maxlength="255">
            </p>
            <p>
                <label for="id_password">Password:</label>
                <input type="password" name="password" required id="id_password" minlength="8">
            </p>
            <button type="submit" class="auth-btn">Sign Up</button>
        </form>
        <p class="auth-link">Already have an account? <a href="{% url 'login' %}">Login here</a></p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toasts = document.querySelectorAll('.static-toast');
            toasts.forEach(toast => {
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            });
        });
    </script>
</body>
</html>
