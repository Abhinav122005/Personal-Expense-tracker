<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Expense Tracker</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'styles.css' %}?v=8">
</head>
<body class="auth-body">
    {% if messages %}
    <div class="toast-container">
        {% for message in messages %}
            <div class="toast {% if message.tags %}{{ message.tags }}{% endif %} show static-toast">
                <span>{% if message.tags == 'success' %}✅{% elif message.tags == 'error' %}❌{% else %}ℹ️{% endif %}</span> 
                <span>{{ message }}</span>
            </div>
        {% endfor %}
    </div>
    {% endif %}

    <div class="auth-container">
        <h1>Set New Password</h1>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Please enter your new password below.</p>
        <form method="post" class="auth-form">
            {% csrf_token %}
            <p>
                <label for="id_password">New Password:</label>
                <input type="password" name="password" required id="id_password" minlength="8" autofocus>
            </p>
            <p>
                <label for="id_confirm_password">Confirm New Password:</label>
                <input type="password" name="confirm_password" required id="id_confirm_password" minlength="8">
            </p>
            <button type="submit" class="auth-btn">Change Password</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toasts = document.querySelectorAll('.static-toast');
            toasts.forEach(toast => {
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            });
        });
    </script>
</body>
</html>
